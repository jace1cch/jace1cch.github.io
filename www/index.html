____&quot;,logseq____&quot;## code学习\\n架构：\\nagent(obs,action)\\n[LLM 结构化管道] → 提取子目标/奖励/语义事实/流程经验\\n[MemoryGraph] → 5种节点类型写入 ChromaDB\\n[ChromaDB 向量库] ← 余弦相似度检索\\n\\n核心组件\\n存储，chromadb,说明：6个集合/图，5个 节点+1个审核日志\\n嵌入：nv-embed-v2，openai，本地确定性回退，4096维度\\nllmprovider配置\\n记忆类型，语义/程序/情节/+标签+子目标，5种节点，图结构关联\\n检索：余弦相似度+标签投票+价值函数评分，两阶段检索+LLM推理\\n\\n根目录\\nplugmem/：核心记忆系统逻辑\\nsrc/基准评测评估代码\\nassets/使用图片\\nexamples/任务适配示例\\nscripts/实验脚本\\nhost_local_inference/本地推理服务\\ntests/单元测试\\n\\nplugmem/核心库\\ncore/记忆引擎logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^19logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Flogseq____&quot;,60,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Xlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Vlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Ulogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^?logseq____&quot;,[logseq____&quot;^ logseq____&quot;,logseq____&quot;^1:logseq____&quot;,2],536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^Jlogseq____&quot;,[],536870961]],[logseq____&quot;^15logseq____&quot;,[59,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a2cddee-bf2e-4d92-9295-d4312cafb7cblogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;程序记忆：怎么做，面向行动的指引\\n情境记忆是知识抽象的源泉，而语义和程序记忆则是最直接用于推理和决策的形式。\\n\\nplugmem的架构与创新\\n基于以上原理，论文推出PLUGMEM，他是一个通用的记忆backbone，包含三个核心模块\\n1.结构化模块：将异构的原始交互轨迹标准化，通过分层抽象提取出成述性知识和程序性知识\\n构建。\\n区别于 GraphRAG： 传统图方法以“实体”或“文本块”为单位，而 PLUGMEM 以知识单元（Knowledge units）作为记忆访问和组织的基本单元。\\n检索模块：选择与当前任务相关的子图，他采用一种抽象-具体交错的策略\\n3 推理模块：测试运行时，将检索到的知识进一步的自适应和压缩聚合，提炼出最精简无冗余的行动指南\\n\\n\\n评估框架与实验结果：\\n效用-成本分析框架（Utility-Cost Analysis）： 引入了信息论指标（Memory Information Density，位/Token），不仅能量化记忆带来的性能提升（效用），还能精准计算其对上下文窗口的消耗（成本）。\\n\\n实验表现： 在长程对话问答（LongMemEval）、多跳知识检索（HotpotQA）和网页智能体（WebArena）三个完全不同的异构基准测试中，PLUGMEM 在不进行任何任务特定修改的前提下，不仅一致优于其他通用基线，甚至超越了那些针对特定任务定制的记忆设计，同时将记忆 Token 的消耗降低了一到两个数量级（见图 1 的理想走向：高收益、低成本）。logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^19logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Flogseq____&quot;,44,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Xlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Vlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^Ulogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[60,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a2cddee-2d24-4d14-b3ba-d7a8d08ba1belogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;routes/demo.py 演示logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^19logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Flogseq____&quot;,53,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Xlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Vlogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^Ulogseq____&quot;,30,536870961]],[logseq____&quot;^15logseq____&quot;,[61,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a2cddee-ae92-4781-9f2b-82b501a038calogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[62,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;base.py 提示模版基类\\n\\napi/fastapi服务+mem uilogseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[62,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^19logseq____&quot;,536870961]],[logseq____&quot;^15logseq____&quot;,[62,logseq____&quot;^Flogseq__       // This script checks to see if a redirect is present in the query string

      (function(l) {

            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
